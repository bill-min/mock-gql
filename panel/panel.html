<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MockGQL</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="tabs">
        <button class="tab active" data-tab="requests">Requests</button>
        <button class="tab" data-tab="mock-rules">Mock Rules</button>
      </div>
      <div class="controls">
        <label class="toggle-switch">
          <span class="toggle-label">Enable Mock</span>
          <input type="checkbox" id="mockingEnabled">
          <span class="toggle-slider"></span>
        </label>
        <button id="clearBtn" class="btn btn-secondary">Clear</button>
      </div>
    </header>

    <div class="content">
      <!-- Requests Tab -->
      <div class="tab-content active" id="requests-tab">
        <div class="split-view">
          <div class="request-list" id="requestList">
            <div class="empty-state">No GraphQL requests captured yet</div>
          </div>
          <div class="resizer" id="requestsResizer"></div>
          <div class="request-detail" id="requestDetail">
            <div class="empty-state">Select a request to view details</div>
          </div>
        </div>
      </div>

      <!-- Mock Rules Tab -->
      <div class="tab-content" id="mock-rules-tab">
        <div class="mock-rules-container">
          <div class="add-rule-form" id="addRuleForm">
            <h3>Add Mock Rule</h3>
            <div class="form-group">
              <label for="operationName">Operation Name</label>
              <input type="text" id="operationName" placeholder="e.g., GetUser">
            </div>
            <div class="form-group">
              <label for="mockResponse">Mock Response (JSON)</label>
              <textarea id="mockResponse" placeholder='{"data": {"user": {"id": "1", "name": "Mock User"}}}'></textarea>
            </div>
            <div class="form-group">
              <label for="mockDelay">Delay (ms)</label>
              <input type="number" id="mockDelay" placeholder="0" min="0" step="100">
            </div>
            <div class="form-actions">
              <button id="addRuleBtn" class="btn btn-primary">Add Rule</button>
              <button id="cancelEditBtn" class="btn btn-secondary" style="display: none;">Cancel</button>
            </div>
          </div>
          <div class="resizer" id="mockRulesResizer"></div>
          <div class="rules-list" id="rulesList">
            <h3>Active Rules</h3>
            <div class="empty-state">No mock rules defined</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
